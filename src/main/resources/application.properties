
# =========================================================
# APPLICATION
# =========================================================
spring.application.name=user-service
server.port=${SERVER_PORT:8082}

# =========================================================
# DATABASE - POSTGRESQL
# =========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
logging.level.liquibase=DEBUG

# =========================================================
# EUREKA CLIENT CONFIGURATION
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================================================
# HIKARI CONNECTION POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=UserServiceHikariPool

# =========================================================
# LIQUIBASE
# =========================================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# =========================================================
# JWT CONFIGURATION
# =========================================================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# =========================================================
# REDIS
# =========================================================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =========================================================
# SWAGGER
# =========================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# =========================================================
# LOGGING
# =========================================================
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# =========================================================
# JACKSON
# =========================================================
spring.jackson.serialization.indent-output=true

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================
# GCP
# =========================================================
spring.cloud.gcp.project-id=${GCP_PROJECT_ID}
spring.cloud.gcp.credentials.location=${GCP_CREDENTIALS}

# =========================================================
# GCS BUCKET
# =========================================================
gcs.bucket.name=${GCS_BUCKET}

# =========================================================
# PUBSUB
# =========================================================
spring.cloud.gcp.pubsub.enabled=${PUBSUB_ENABLED:true}

house.pubsub.topic=${HOUSE_TOPIC}
user.pubsub.topic=${USER_TOPIC}
pubsub.subscription.device-registered=${DEVICE_REGISTERED_SUB}

